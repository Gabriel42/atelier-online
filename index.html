<style>
/* The door of the online menu: the whole menu is in this file, encrypted; the password opens it. */
:root { --bg: #f4f2ed; --panel: #fffdf9; --ink: #26231f; --muted: #6f6a61; --line: #cfc7b8; --accent: #9a5a14; --accent-ink: #fffaf2; --bad: #b3261e; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #191816; --panel: #201f1c; --ink: #ebe6dd; --muted: #a59e92; --line: #45423c; --accent: #e2a85c; --accent-ink: #231a0d; --bad: #f08a80; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  display: grid; place-items: center; padding: 16px; }
form { width: min(340px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px 22px; display: grid; gap: 12px; }
.mark { width: 48px; height: 48px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 22px; }
h1 { margin: 4px 0 0; font-size: 22px; }
p { margin: 0; color: var(--muted); }
label { font-size: 13px; color: var(--muted); display: grid; gap: 5px; }
input[type=password] { font: inherit; color: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.keep { display: flex; align-items: center; gap: 8px; }
button { font: inherit; font-weight: 600; padding: 9px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
#msg { min-height: 1.5em; color: var(--bad); font-size: 13px; }
</style>

  const STORE = 'atelier-key';
  const bytes = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));
  const base64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const $ = (id) => document.getElementById(id);

  async function keyFrom(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(LOCKED.salt), iterations: LOCKED.iterations },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  const decrypt = async (key) => new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(LOCKED.iv) }, key, bytes(LOCKED.data)));
  // Replace this page only once it has fully loaded: writing earlier would add the menu next to the form.
  const loaded = new Promise((done) => (document.readyState === 'complete' ? done() : addEventListener('load', done)));
  const show = async (page) => { await loaded; document.open(); document.write(page); document.close(); };

  // A remembered key opens the menu straight away (it stops working when the password changes).
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch { /* storage blocked */ }
  if (saved) crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt']).then(decrypt).then(show)
    .catch(() => { try { localStorage.removeItem(STORE); } catch { /* storage blocked */ } });

  if (!globalThis.crypto?.subtle) { $('msg').textContent = 'This browser cannot open the page here. Open it from its https:// address.'; $('go').disabled = true; return; }

  $('door').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('go').disabled = true; $('msg').textContent = '';
    let page;
    try {
      const key = await keyFrom($('pw').value);
      page = await decrypt(key);
      if ($('keep').checked) { try { localStorage.setItem(STORE, base64(await crypto.subtle.exportKey('raw', key))); } catch { /* storage blocked */ } }
    } catch {
      $('msg').textContent = 'Wrong password.';
      $('go').disabled = false;
      return;
    }
    show(page);
  });
})();
